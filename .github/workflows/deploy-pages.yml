name: Publicar sitio (GitHub Pages)

# Publica la carpeta site/ como página web cada vez que se actualiza main.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar la carpeta del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
